# gitleaks 설정(check-security-tools.sh). 기본 규칙을 모두 쓰고, 아래 표본 파일의 정해진 규칙만 예외로 둡니다.
# 예외는 진짜 비밀이 아니라 가리기 규칙의 예시·시험 표본이라 있어야 하는 글자입니다. 파일을 넓게(폴더·glob) 빼지 않고
# 파일 하나·규칙 하나씩 적습니다. 새로 넣을 때는 그 글자가 가짜인 까닭을 description에 적고 통합 담당 확인을 받습니다.

[extend]
useDefault = true

[[allowlists]]
description = "로그 가리기 규칙의 예시와 시험 표본: 머리 줄만 있는 PRIVATE KEY, 서명이 'signature-test'인 JWT, base64 'secret-ticket'"
targetRules = ["private-key", "jwt", "generic-api-key"]
paths = [
  '''^crates/services/logs/redaction-rules\.json$''',
  '''^crates/services/logs/tests/redaction\.rs$''',
  '''^crates/services/logs/tests/collector\.rs$''',
  '''^crates/services/logs/tests/fixtures/key-value-samples\.json$''',
]

[[allowlists]]
description = "키 파일 어댑터 적합성 시험: 시험이 실행 중에 만든 키를 PEM으로 감싸는 머리 줄 문자열"
targetRules = ["private-key"]
paths = [
  '''^crates/adapters/mookko-keys-file/tests/conformance\.rs$''',
]
